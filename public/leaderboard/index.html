<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060911" />
    <link rel="icon" type="image/png" href="../branding/home-logo-cutout.png" />
    <title>经理排行榜 · 篮球经理：联盟扩军时代</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #eaf3fa; background: #070e19; font-variant-numeric: tabular-nums; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; background: radial-gradient(circle at 75% 0%, #173149, transparent 38%), linear-gradient(180deg, #0a1627, #070e19 60%); }
      button, a { font: inherit; }
      button:focus-visible, a:focus-visible { outline: 2px solid #00e7f4; outline-offset: 3px; }
      main { width: min(100%, 560px); min-height: 100dvh; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 14px max(34px, env(safe-area-inset-bottom)); }
      header { display: flex; align-items: center; gap: 11px; padding-bottom: 13px; border-bottom: 1px solid #2a4356; }
      .back { display: grid; width: 36px; height: 36px; flex: none; place-items: center; color: #00d9ef; border: 1px solid #3b5b6f; background: #102537; text-decoration: none; font-size: 25px; line-height: 1; }
      .heading { min-width: 0; flex: 1; }
      .heading small, .section-title small, .ranking-hero small { color: #00d9ef; font: 900 9px ui-monospace, monospace; letter-spacing: .14em; }
      h1 { margin: 3px 0 0; font-size: 17px; line-height: 1.2; }
      .refresh { padding: 8px 9px; color: #c4eaf0; border: 1px solid #3b5b6f; background: #102537; font-size: 10px; cursor: pointer; }
      .refresh:disabled { opacity: .5; cursor: wait; }
      .ranking-hero { padding: 26px 4px 21px; }
      .ranking-hero h2 { margin: 8px 0; font-size: clamp(24px, 6vw, 32px); line-height: 1.12; }
      .ranking-hero p { margin: 0; color: #99afc2; font-size: 11px; line-height: 1.55; }
      .mine { padding: 16px; border: 1px solid #476278; border-top: 2px solid #d5ac5c; background: radial-gradient(circle at 90% 5%, rgba(213,172,92,.15), transparent 34%), linear-gradient(135deg, #172c40, #0d1a2b 75%); }
      .mine-heading, .mine-values, .mine-facts { display: flex; justify-content: space-between; gap: 12px; }
      .mine-heading { align-items: baseline; padding-bottom: 14px; border-bottom: 1px solid #30465a; }
      .mine-heading span { color: #d5ac5c; font: 900 9px ui-monospace, monospace; letter-spacing: .13em; }
      .mine-heading b { margin-left: 7px; color: #eaf3fa; font: 900 12px Inter, sans-serif; letter-spacing: 0; }
      .mine-heading small, .mine-identity small, .mine-values small { color: #8ca8bc; font-size: 10px; }
      .mine-identity { display: flex; align-items: center; gap: 11px; padding: 15px 0; }
      .mine-identity > div { display: grid; min-width: 0; gap: 3px; }
      .mine-identity strong { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
      .mine-emblem { display: grid; width: 38px; height: 38px; flex: none; place-items: center; border: 1px solid #6d6650; background: #283045; color: #f4d691; font: 900 13px ui-monospace, monospace; }
      .mine-values { align-items: end; padding: 12px 0 16px; border-top: 1px solid #30465a; border-bottom: 1px solid #30465a; }
      .mine-values > div { display: grid; gap: 6px; }
      .mine-values > div:last-child { text-align: right; }
      .mine-values strong { color: #f4cc79; font-size: clamp(21px, 5vw, 29px); line-height: 1; }
      .mine-values b { color: #00d9ef; font-size: 22px; line-height: 1; }
      .mine-facts { padding-top: 12px; color: #9eb6c7; font-size: 10px; }
      .submit { margin-top: 9px; padding: 10px 12px; border: 1px solid #2b5262; background: #102536; }
      .submit p { margin: 0; color: #9eb6c7; font-size: 10px; line-height: 1.5; }
      .submit .message { margin-top: 5px; color: #f6d28a; }
      .submit button { margin-top: 9px; padding: 7px 12px; color: #061722; border: 0; background: #00d9ef; font-size: 10px; font-weight: 900; cursor: pointer; }
      .submit button[hidden] { display: none; }
      .section-title { display: flex; justify-content: space-between; align-items: end; margin: 25px 0 10px; gap: 12px; }
      .section-title h2 { margin: 4px 0 0; font-size: 16px; }
      .section-title > span { color: #8fa8ba; font-size: 10px; }
      .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
      .podium article { min-width: 0; min-height: 125px; padding: 12px 8px; border: 1px solid #30495f; background: linear-gradient(155deg, #12293b, #0c1a2c); text-align: center; }
      .podium article:first-child { border-color: #b9954e; background: linear-gradient(155deg, #40371f, #102638 76%); }
      .podium em { display: grid; width: 31px; height: 31px; margin: 0 auto 10px; place-items: center; border: 1px solid #967d50; border-radius: 50%; color: #f4cc79; font-size: 13px; font-style: normal; font-weight: 900; }
      .podium b { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .podium small { display: block; margin-top: 5px; color: #88a4b7; font-size: 9px; }
      .podium strong { display: block; margin-top: 6px; color: #f5d28a; font-size: 16px; }
      .list { padding: 0 12px; border: 1px solid #30495f; background: #0e1c2d; }
      .row { display: grid; min-height: 63px; grid-template-columns: 27px 35px minmax(0, 1fr) auto; align-items: center; gap: 8px; border-bottom: 1px solid #25394c; }
      .row:last-child { border-bottom: 0; }
      .row .rank { color: #88a5ba; font-size: 12px; font-weight: 900; text-align: center; }
      .row.top-rank .rank { color: #f1c86e; }
      .row .avatar { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid #3c5b70; background: #19334a; color: #b9dfe7; font-size: 11px; font-weight: 900; }
      .row .name { display: grid; min-width: 0; gap: 3px; }
      .row .name b { overflow: hidden; color: #eef6fb; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .row .name small { color: #7899ad; font-size: 9px; }
      .row .score { color: #e6c379; font-size: 13px; font-weight: 900; white-space: nowrap; }
      .row.mine-row { margin-inline: -12px; padding-inline: 12px; background: rgba(0,217,239,.09); }
      .state { margin: 0; padding: 24px 12px; color: #a7bfd0; font-size: 12px; line-height: 1.55; text-align: center; }
      .state.error { color: #ffb2a5; }
      .rule { margin: 15px 0 0; color: #829daf; font-size: 10px; line-height: 1.5; }
      @media (max-width: 375px) { .mine-facts { gap: 5px; font-size: 9px; } .row { gap: 6px; } .row .score { font-size: 11px; } }
    </style>
  </head>
  <body>
    <main>
      <header><a class="back" id="back" href="../index.html" aria-label="返回生涯页面">‹</a><div class="heading"><small>GLOBAL RANK</small><h1>经理排行榜</h1></div><button class="refresh" id="refresh" type="button">刷新榜单 ↻</button></header>
      <div class="ranking-hero"><small>DYNASTY SCORE · 王朝积分</small><h2>全服经理，一较高下</h2><p>按账号最高王朝积分排名；同分时，先达到该积分的经理排在前面。</p></div>
      <section class="mine" aria-label="我的排名"><div class="mine-heading"><span>MY RANK <b>我的排名</b></span><small>账号最高成绩</small></div><div class="mine-identity"><span class="mine-emblem" aria-hidden="true">GM</span><div><strong id="my-name">正在读取经理资料</strong><small id="my-team">当前存档</small></div></div><div class="mine-values"><div><small>全服名次</small><strong id="my-rank">正在加载</strong></div><div><small>王朝积分</small><b id="my-score">—</b></div></div><div class="mine-facts"><span id="my-season">赛季 —</span><span id="my-championships">总冠军 —</span><span id="my-achievements">成就 —</span></div></section>
      <section class="submit" aria-label="成绩自动同步"><p id="local-score">从生涯总览进入后，当前成绩会自动校验并同步。</p><p class="message" id="submit-message" role="status" aria-live="polite" hidden></p><button id="retry-sync" type="button" hidden>重试同步</button></section>
      <div class="section-title"><div><small>TOP THREE</small><h2>荣耀前三</h2></div><span>最高王朝积分</span></div>
      <section class="podium" id="podium" aria-label="排行榜前三名"></section>
      <div class="section-title"><div><small>SCORE BOARD</small><h2>王朝积分总榜</h2></div><span>前 100 名</span></div>
      <section class="list" id="list" aria-label="排行榜列表"><p class="state" id="status" role="status">正在加载榜单…</p></section>
      <p class="rule">榜单记录账号最高成绩。当前存档的球队、赛季和荣誉仅在“我的排名”中展示。</p>
    </main>
    <script src="./config.js"></script>
    <script>
      const podium = document.getElementById("podium");
      const list = document.getElementById("list");
      const refreshButton = document.getElementById("refresh");
      const backLink = document.getElementById("back");
      const careerSlot = new URLSearchParams(window.location.search).get("careerSlot");
      if (["1", "2", "3"].includes(careerSlot)) backLink.href = `../index.html?careerSlot=${careerSlot}`;
      const myRank = document.getElementById("my-rank");
      const myName = document.getElementById("my-name");
      const myScore = document.getElementById("my-score");
      const myTeam = document.getElementById("my-team");
      const mySeason = document.getElementById("my-season");
      const myChampionships = document.getElementById("my-championships");
      const myAchievements = document.getElementById("my-achievements");
      const retryButton = document.getElementById("retry-sync");
      const localScore = document.getElementById("local-score");
      const submitMessage = document.getElementById("submit-message");
      const proofKey = "basketball-manager-leaderboard-proof-v1";
      let localProof = null;
      try {
        const saved = sessionStorage.getItem(proofKey);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed?.version === 1 && Number.isSafeInteger(parsed.score) && parsed.score >= 0) {
            localProof = parsed;
            localScore.textContent = `当前存档 ${parsed.score.toLocaleString("zh-CN")} 分 · 自动同步账号最高成绩`;
            myName.textContent = parsed.displayName || "虎扑经理";
            myTeam.textContent = typeof parsed.teamName === "string" ? parsed.teamName : "当前存档";
            mySeason.textContent = `赛季 ${typeof parsed.seasonId === "string" ? parsed.seasonId : "—"}`;
            myChampionships.textContent = `总冠军 ${Number.isSafeInteger(parsed.championships) ? parsed.championships : "—"}`;
            myAchievements.textContent = `成就 ${Array.isArray(parsed.achievements) ? parsed.achievements.length : "—"}`;
          }
        }
      } catch { /* Reading a leaderboard does not require local storage. */ }

      function status(message, error = false) {
        list.replaceChildren();
        const element = document.createElement("p");
        element.className = error ? "state error" : "state";
        element.setAttribute("role", error ? "alert" : "status");
        element.textContent = message;
        list.append(element);
      }

      async function request(path, options = {}) {
        if (!window.ACTIVITY_API_BASE || !window.ColorboxAI?.cloud?.request || (options.auth && !window.ACTIVITY_ENV_ID)) {
          throw new Error("排行榜服务暂未开放，请稍后再试。");
        }
        const response = await window.ColorboxAI.cloud.request({
          url: window.ACTIVITY_API_BASE + path,
          method: options.method || "GET",
          data: options.data,
          ...(options.auth ? { auth: true, envId: window.ACTIVITY_ENV_ID } : {})
        });
        if (response.statusCode !== 200 || (response.code !== 0 && response.code !== 200)) {
          throw new Error(response.message || "榜单加载失败，请稍后再试。");
        }
        return response.data;
      }

      function addText(parent, tag, className, value) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = String(value);
        parent.append(element);
      }

      function render(entries) {
        podium.replaceChildren();
        list.replaceChildren();
        if (!entries.length) {
          status("榜单暂时还没有成绩。");
          return;
        }
        for (const entry of entries.slice(0, 3)) {
          const card = document.createElement("article");
          addText(card, "em", "", entry.rank);
          addText(card, "b", "", entry.displayName || "虎扑经理");
          addText(card, "small", "", "王朝积分");
          addText(card, "strong", "", Number(entry.score).toLocaleString("zh-CN"));
          podium.append(card);
        }
        for (const entry of entries) {
          const row = document.createElement("div");
          row.className = `row${entry.rank <= 3 ? " top-rank" : ""}${entry.isCurrent ? " mine-row" : ""}`;
          addText(row, "span", "rank", entry.rank);
          addText(row, "span", "avatar", Array.from(entry.displayName || "经理").slice(0, 2).join(""));
          const identity = document.createElement("span");
          identity.className = "name";
          addText(identity, "b", "", `${entry.displayName || "虎扑经理"}${entry.isCurrent ? " · 我" : ""}`);
          addText(identity, "small", "", "经理 · 王朝积分");
          row.append(identity);
          addText(row, "strong", "score", `${Number(entry.score).toLocaleString("zh-CN")} 分`);
          list.append(row);
        }
      }

      async function load() {
        refreshButton.disabled = true;
        podium.replaceChildren();
        status("正在加载榜单…");
        myRank.textContent = "正在加载";
        myName.textContent = localProof?.displayName || "虎扑经理";
        myScore.textContent = "—";
        try {
          const payload = await request("/leaderboard", { data: { limit: 100 } });
          const entries = Array.isArray(payload) ? payload : payload?.entries;
          if (!Array.isArray(entries)) throw new Error("榜单数据格式不正确。");
          const validEntries = entries.filter((entry) => Number.isInteger(entry.rank) && Number.isFinite(Number(entry.score)));
          render(validEntries);
          try {
            const mine = await request("/leaderboard/me", { auth: true });
            myRank.textContent = mine ? `第 ${mine.rank} 名` : "暂未上榜";
            myName.textContent = mine?.displayName || localProof?.displayName || "虎扑经理";
            myScore.textContent = mine ? Number(mine.score).toLocaleString("zh-CN") : "—";
            if (mine) render(validEntries.map((entry) => ({ ...entry, isCurrent: String(entry.id) === String(mine.id) })));
          } catch (error) {
            myRank.textContent = "暂不可用";
            submitMessage.hidden = false;
            submitMessage.setAttribute("role", "alert");
            submitMessage.textContent = error instanceof Error ? error.message : "个人名次暂不可用";
          }
        } catch (error) {
          myRank.textContent = "暂不可用";
          status(error instanceof Error ? error.message : "榜单加载失败，请稍后再试。", true);
        } finally {
          refreshButton.disabled = false;
        }
      }

      let syncing = false;
      async function syncScore() {
        if (!localProof || syncing) return false;
        syncing = true;
        retryButton.hidden = true;
        submitMessage.hidden = false;
        submitMessage.setAttribute("role", "status");
        submitMessage.textContent = "正在自动校验并同步成绩…";
        try {
          await request("/leaderboard/submit", {
            method: "POST", auth: true,
            data: { proof: localProof, displayName: localProof.displayName }
          });
          submitMessage.textContent = "成绩已自动同步。";
          localProof = null;
          try { sessionStorage.removeItem(proofKey); } catch { /* Successful sync is already confirmed. */ }
          return true;
        } catch (error) {
          submitMessage.setAttribute("role", "alert");
          submitMessage.textContent = error instanceof Error ? error.message : "成绩提交失败，请稍后再试。";
          retryButton.hidden = false;
          return false;
        } finally {
          syncing = false;
        }
      }

      backLink.addEventListener("click", (event) => {
        event.preventDefault();
        if (new URLSearchParams(window.location.search).get("embedded") === "1" && window.parent !== window) {
          window.parent.postMessage("basketball-manager:close-leaderboard", "*");
          return;
        }
        window.location.replace(backLink.href);
      });
      refreshButton.addEventListener("click", load);
      retryButton.addEventListener("click", async () => {
        if (await syncScore()) await load();
      });
      (async () => {
        await syncScore();
        await load();
      })();
    </script>
  </body>
</html>
